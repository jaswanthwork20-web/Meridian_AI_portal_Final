services:
  backend:
    image: ${BACKEND_IMAGE:-meridian-backend:local}
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-development}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      DATABASE_PATH: /app/backend/data/shopmart.db
    expose:
      - "8001"
    volumes:
      - backend-db:/app/backend/data
      - backend-uploads:/app/backend/uploaded_tax_documents
      - backend-service-state:/app/backend/services/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5)"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  frontend:
    image: ${FRONTEND_IMAGE:-meridian-frontend:local}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--spider",
          "--quiet",
          "http://127.0.0.1/health"
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  backend-db:
  backend-uploads:
  backend-service-state:
