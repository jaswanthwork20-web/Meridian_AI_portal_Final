name: Meridian CI-CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

# ==================================================
# GLOBAL ENVIRONMENT
# ==================================================

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID || '317492541707' }}
  ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID || '317492541707' }}.dkr.ecr.${{ vars.AWS_REGION || 'us-east-1' }}.amazonaws.com
  ECR_FRONTEND_REPOSITORY: ${{ vars.ECR_FRONTEND_REPOSITORY || 'github-cicd-demo-frontend' }}
  ECR_BACKEND_REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY || 'github-cicd-demo-backend' }}

# ==================================================
# GLOBAL PERMISSIONS
# ==================================================

permissions:
  contents: read

concurrency:
  group: meridian-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# ==================================================
# JOBS
# ==================================================

jobs:
  # ==================================================
  # 1. PYTHON SYNTAX CHECK
  # ==================================================
  syntax:
    name: Python syntax
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile backend
        working-directory: backend
        run: python -m compileall -q .

  # ==================================================
  # 2. RUFF LINT
  # ==================================================
  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Ruff
        run: python -m pip install --upgrade pip ruff
      - name: Run Ruff
        working-directory: backend
        run: ruff check . || true

  # ==================================================
  # 3. UNUSED CODE SCAN
  # ==================================================
  unused-code:
    name: Unused code scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Vulture
        run: python -m pip install --upgrade pip vulture
      - name: Run Vulture
        working-directory: backend
        run: vulture . --min-confidence 80 || true

  # ==================================================
  # 4. TYPE CHECK
  # ==================================================
  type-check:
    name: MyPy type check
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -r requirements.txt mypy
      - name: Run MyPy
        working-directory: backend
        run: mypy . || true

  # ==================================================
  # 5. UNIT TESTS + COVERAGE
  # ==================================================
  test:
    name: Tests
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      JWT_SECRET: ci-test-secret-that-is-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pytest-cov fastapi sqlalchemy python-dotenv bcrypt 'python-jose[cryptography]'
      - name: Run focused unit tests
        run: pytest -q backend/tests/test_auth_security.py --cov=backend --cov-report=term-missing --cov-report=xml

  # ==================================================
  # 6. BANDIT SECURITY SCAN
  # ==================================================
  security:
    name: Bandit security scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Bandit
        run: python -m pip install --upgrade pip bandit
      - name: Run Bandit
        working-directory: backend
        run: bandit -r . -ll -x tests || true

  # ==================================================
  # 7. SECRET DETECTION
  # ==================================================
  secrets:
    name: Secret detection
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ==================================================
  # 8. DEPENDENCY SCAN
  # ==================================================
  dependency-scan:
    name: Dependency scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit
      - name: Run pip-audit
        run: pip-audit -r backend/requirements.txt || true

  # ==================================================
  # 9. BUILD DOCKER IMAGES
  # ==================================================
  build:
    name: Build Docker images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # needs: [syntax, lint, unused-code, type-check, test, security, secrets, dependency-scan]
    runs-on: ubuntu-latest
    environment:
      name: docker-build-approval
    steps:
      - uses: actions/checkout@v4
      - name: Build frontend image
        run: docker build -t "$ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:latest" ./frontend
      - name: Build backend image
        run: docker build -t "$ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:latest" ./backend
      - name: Save Docker images
        run: |
          docker save "$ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:latest" -o frontend.tar
          docker save "$ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:latest" -o backend.tar
      - name: Upload Docker images
        uses: actions/upload-artifact@v4
        with:
          name: container-images
          path: |
            frontend.tar
            backend.tar
          retention-days: 1
          if-no-files-found: error
          
  # ==================================================
  # 10. DOCKER VULNERABILITY SCAN
  # ==================================================
  container-security:
    name: Container vulnerability scan
    if: false
    needs: [build]
    
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: container-images
      - name: Load Docker images
        run: |
          docker load -i frontend.tar
          docker load -i backend.tar
      - name: Trivy frontend scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ env.ECR_FRONTEND_REPOSITORY }}:latest
          severity: CRITICAL,HIGH
          format: table
          exit-code: "0"
      - name: Trivy backend scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.ECR_REGISTRY }}/${{ env.ECR_BACKEND_REPOSITORY }}:latest
          severity: CRITICAL,HIGH
          format: table
          exit-code: "0"

  # ==================================================
  # 11. SBOM GENERATION
  # ==================================================
  sbom:
    name: Generate SBOM
    if: false
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: container-images
      - name: Load Docker images
        run: |
          docker load -i frontend.tar
          docker load -i backend.tar
      - name: Install Syft
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/v1.52.0/install.sh | sh -s -- -b /usr/local/bin v1.52.0
      - name: Generate frontend SBOM
        run: syft "$ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:latest" -o cyclonedx-json=frontend-sbom.json
      - name: Generate backend SBOM
        run: syft "$ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:latest" -o cyclonedx-json=backend-sbom.json
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: "*-sbom.json"
          retention-days: 90
          if-no-files-found: error


  # ==================================================
  # 12. PUSH IMAGES TO ECR
  # ==================================================
  push-ecr:
    name: Push images to ECR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # needs: [container-security, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: container-images
      - name: Load Docker images
        run: |
          docker load -i frontend.tar
          docker load -i backend.tar
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Push latest images
        run: |
          set -euo pipefail
          docker push "$ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:latest"
          docker push "$ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:latest"
          
  # ==================================================
  # 13. DEPLOY TO EC2 USING SSM
  # ==================================================
  deploy:
    name: Deploy to EC2 with SSM
    needs: [push-ecr]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    env:
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      APP_DIR: ${{ vars.EC2_APP_DIR || '/home/ssm-user/Meridian-Tech-Integrated' }}
      SECRET_NAME: ${{ vars.APP_SECRET_NAME || 'Meridian-Secret-For-EC2' }}

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy latest release
        shell: bash
        run: |
          set -euo pipefail

          : "${EC2_INSTANCE_ID:?Set the EC2_INSTANCE_ID repository variable}"
          : "${APP_DIR:?Set the EC2_APP_DIR repository variable}"
          : "${SECRET_NAME:?Set the APP_SECRET_NAME repository variable}"

          echo "Preparing deployment script..."

          # --------------------------------------------------
          # Build the remote deployment script locally.
          # printf %q safely escapes all values before sending
          # them to EC2.
          # --------------------------------------------------

          remote_script=$(cat <<EOF
          #!/usr/bin/env bash

          set -euo pipefail

          export APP_DIR=$(printf '%q' "$APP_DIR")
          export AWS_REGION=$(printf '%q' "$AWS_REGION")
          export SECRET_NAME=$(printf '%q' "$SECRET_NAME")
          export ECR_REGISTRY=$(printf '%q' "$ECR_REGISTRY")
          export BACKEND_IMAGE=$(printf '%q' "$ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:latest")
          export FRONTEND_IMAGE=$(printf '%q' "$ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:latest")

          stage='starting deployment'

          trap 'status=\$?; echo "DEPLOYMENT FAILED during: \$stage (exit \$status)" >&2; exit "\$status"' ERR

          echo '=========================================='
          echo 'STARTING DEPLOYMENT'
          echo '=========================================='

          # --------------------------------------------------
          # 1. APPLICATION DIRECTORY
          # --------------------------------------------------

          stage="entering application directory: \$APP_DIR"
          echo "Stage: \$stage"

          cd "\$APP_DIR"

          # --------------------------------------------------
          # 2. DEPLOYMENT FILES
          # --------------------------------------------------

          stage='checking docker-compose.yml and deployment settings'
          echo "Stage: \$stage"

          test -f docker-compose.yml

          : "\${BACKEND_IMAGE:?Backend image is required}"
          : "\${FRONTEND_IMAGE:?Frontend image is required}"

          echo "Application directory: \$APP_DIR"
          echo "Backend image: \$BACKEND_IMAGE"
          echo "Frontend image: \$FRONTEND_IMAGE"

          # --------------------------------------------------
          # 3. SAVE CURRENT IMAGE DIGESTS FOR ROLLBACK
          # --------------------------------------------------

          stage='saving previous image digests'
          echo "Stage: \$stage"

          rm -f .previous_backend_digest
          rm -f .previous_frontend_digest

          docker image inspect "\$BACKEND_IMAGE" \
            --format '{{index .RepoDigests 0}}' \
            > .previous_backend_digest 2>/dev/null || true

          docker image inspect "\$FRONTEND_IMAGE" \
            --format '{{index .RepoDigests 0}}' \
            > .previous_frontend_digest 2>/dev/null || true

          # --------------------------------------------------
          # 4. CHECK AWS IDENTITY
          # --------------------------------------------------

          stage='checking EC2 AWS identity and secret access'
          echo "Stage: \$stage"

          aws sts get-caller-identity \
            --region "\$AWS_REGION"

          # --------------------------------------------------
          # 5. CHECK SECRET
          # --------------------------------------------------

          aws secretsmanager describe-secret \
            --secret-id "\$SECRET_NAME" \
            --region "\$AWS_REGION" \
            >/dev/null

          # --------------------------------------------------
          # 6. RETRIEVE SECRET
          # --------------------------------------------------

          stage='retrieving application secret'
          echo "Stage: \$stage"

          secret_json=\$(aws secretsmanager get-secret-value \
            --secret-id "\$SECRET_NAME" \
            --region "\$AWS_REGION" \
            --query SecretString \
            --output text)

          test -n "\$secret_json"

          # --------------------------------------------------
          # 7. WRITE .ENV
          # --------------------------------------------------

          stage='writing runtime environment file'
          echo "Stage: \$stage"

          printf '%s' "\$secret_json" | python3 -c '
          import json
          import re
          import sys

          values = json.load(sys.stdin)

          if not isinstance(values, dict):
              raise SystemExit(
                  "Secrets Manager value must be a JSON object"
              )

          reserved = {
              "ENVIRONMENT",
              "AWS_REGION",
              "DATABASE_PATH",
              "BACKEND_IMAGE",
              "FRONTEND_IMAGE"
          }

          for key, value in values.items():

              if not re.fullmatch(
                  r"[A-Za-z_][A-Za-z0-9_]*",
                  key
              ):
                  continue

              if key in reserved:
                  continue

              if isinstance(value, (dict, list)):
                  value = json.dumps(
                      value,
                      separators=(",", ":")
                  )
              else:
                  value = str(value)

              print(
                  f"{key}={json.dumps(value)}"
              )
          ' > .env

          # Verify required secret exists
          grep -q '^JWT_SECRET=' .env

          # Add deployment-specific variables
          printf '%s\n' \
            "ENVIRONMENT=production" \
            "AWS_REGION=\$AWS_REGION" \
            "DATABASE_PATH=/app/backend/data/shopmart.db" \
            "BACKEND_IMAGE=\$BACKEND_IMAGE" \
            "FRONTEND_IMAGE=\$FRONTEND_IMAGE" \
            >> .env

          chmod 600 .env

          echo "Runtime .env file created successfully."

          # --------------------------------------------------
          # 8. LOGIN TO ECR
          # --------------------------------------------------

          stage='logging in to Amazon ECR'
          echo "Stage: \$stage"

          aws ecr get-login-password \
            --region "\$AWS_REGION" \
            | docker login \
                --username AWS \
                --password-stdin "\$ECR_REGISTRY"

          # --------------------------------------------------
          # 9. PULL NEW IMAGES
          # --------------------------------------------------

          stage='pulling latest Docker images'
          echo "Stage: \$stage"

          docker compose pull

          # --------------------------------------------------
          # 10. START APPLICATION
          # --------------------------------------------------

          stage='starting application containers'
          echo "Stage: \$stage"

          docker compose up -d \
            --no-build \
            --remove-orphans

          # --------------------------------------------------
          # 11. CONTAINER STATUS
          # --------------------------------------------------

          stage='checking container status'
          echo "Stage: \$stage"

          docker compose ps

          echo '=========================================='
          echo 'DEPLOYMENT COMPLETED SUCCESSFULLY'
          echo '=========================================='
          EOF
          )

          # --------------------------------------------------
          # Encode the script so SSM receives it safely.
          # This completely avoids shell quoting problems.
          # --------------------------------------------------

          encoded_script=$(printf '%s' "$remote_script" | base64 -w 0)

          remote_command="echo '$encoded_script' | base64 -d | bash"

          jq -n \
            --arg command "$remote_command" \
            '{commands: [$command]}' \
            > ssm-commands.json

          echo 'Sending deployment command to EC2...'

          command_id=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment 'Deploy Meridian latest release' \
            --parameters file://ssm-commands.json \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM command ID: $command_id"

          # --------------------------------------------------
          # Wait for SSM
          # --------------------------------------------------

          for attempt in $(seq 1 60); do

            status=$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || true)

            echo "[$attempt/60] SSM status: ${status:-Pending}"

            case "$status" in

              Success)

                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$command_id" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query StandardOutputContent \
                  --output text

                echo "Deployment succeeded."
                exit 0
                ;;

              Failed|Cancelled|TimedOut|Cancelling)

                echo "=========================================="
                echo "SSM DEPLOYMENT FAILED"
                echo "=========================================="

                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$command_id" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query '{
                    Status:Status,
                    StatusDetails:StatusDetails,
                    Output:StandardOutputContent,
                    Error:StandardErrorContent
                  }' \
                  --output json || true

                exit 1
                ;;

              *)
                [ "$attempt" -eq 60 ] || sleep 10
                ;;
            esac

          done

          echo "SSM deployment timed out."

          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$command_id" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{
              Status:Status,
              StatusDetails:StatusDetails,
              Output:StandardOutputContent,
              Error:StandardErrorContent
            }' \
            --output json || true

          exit 1


  # ==================================================
  # 14. VERIFY DEPLOYMENT
  # ==================================================
  verify:
    name: Verify deployment
    needs: [deploy]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      APP_DIR: ${{ vars.EC2_APP_DIR || '/home/ssm-user/Meridian-Tech-Integrated' }}

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify deployment
        shell: bash
        run: |
          set -euo pipefail

          : "${EC2_INSTANCE_ID:?Set the EC2_INSTANCE_ID repository variable}"
          : "${APP_DIR:?Set the EC2_APP_DIR repository variable}"

          echo "Preparing verification script..."

          remote_script=$(cat <<EOF
          #!/usr/bin/env bash

          set -euo pipefail

          export APP_DIR=$(printf '%q' "$APP_DIR")

          stage='entering application directory'

          trap 'status=\$?; echo "VERIFICATION FAILED during: \$stage (exit \$status)" >&2; exit "\$status"' ERR

          cd "\$APP_DIR"

          # --------------------------------------------------
          # Container status
          # --------------------------------------------------

          stage='checking Docker Compose services'
          echo "Stage: \$stage"

          docker compose ps

          docker compose ps \
            --status running \
            --services \
            | grep -qx backend

          docker compose ps \
            --status running \
            --services \
            | grep -qx frontend

          # --------------------------------------------------
          # Backend health
          # --------------------------------------------------

          stage='checking backend health'
          echo "Stage: \$stage"

          docker compose exec -T backend \
            python -c \
            "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=10)"

          # --------------------------------------------------
          # Frontend health
          # --------------------------------------------------

          stage='checking frontend health'
          echo "Stage: \$stage"

          docker compose exec -T frontend \
            wget --spider --quiet \
            http://127.0.0.1/health

          # --------------------------------------------------
          # Reverse proxy
          # --------------------------------------------------

          stage='checking public reverse-proxy health'
          echo "Stage: \$stage"

          curl \
            --fail \
            --silent \
            --show-error \
            http://127.0.0.1/health \
            >/dev/null

          echo '=========================================='
          echo 'BACKEND HEALTH: PASS'
          echo 'FRONTEND HEALTH: PASS'
          echo 'REVERSE PROXY HEALTH: PASS'
          echo 'DEPLOYMENT VERIFICATION PASSED'
          echo '=========================================='
          EOF
          )

          encoded_script=$(printf '%s' "$remote_script" | base64 -w 0)

          remote_command="echo '$encoded_script' | base64 -d | bash"

          jq -n \
            --arg command "$remote_command" \
            '{commands: [$command]}' \
            > verify.json

          command_id=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment 'Verify Meridian deployment' \
            --parameters file://verify.json \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM verification command ID: $command_id"

          for attempt in $(seq 1 30); do

            status=$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || true)

            echo "[$attempt/30] Verification status: ${status:-Pending}"

            case "$status" in

              Success)

                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$command_id" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query StandardOutputContent \
                  --output text

                exit 0
                ;;

              Failed|Cancelled|TimedOut|Cancelling)

                echo "=========================================="
                echo "DEPLOYMENT VERIFICATION FAILED"
                echo "=========================================="

                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$command_id" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query '{
                    Status:Status,
                    StatusDetails:StatusDetails,
                    Output:StandardOutputContent,
                    Error:StandardErrorContent
                  }' \
                  --output json || true

                exit 1
                ;;

              *)
                [ "$attempt" -eq 30 ] || sleep 10
                ;;
            esac

          done

          exit 1


  # ==================================================
  # 15. ROLLBACK
  # ==================================================
  rollback:
    name: Roll back deployment
    needs: [deploy, verify]

    if: >
      ${{ always() &&
          github.event_name == 'push' &&
          github.ref == 'refs/heads/main' &&
          (needs.deploy.result == 'failure' ||
           needs.verify.result == 'failure') }}

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      APP_DIR: ${{ vars.EC2_APP_DIR || '/home/ssm-user/Meridian-Tech-Integrated' }}

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Start rollback
        shell: bash
        run: |
          set -euo pipefail

          : "${EC2_INSTANCE_ID:?Set the EC2_INSTANCE_ID repository variable}"
          : "${APP_DIR:?Set the EC2_APP_DIR repository variable}"

          echo "Preparing rollback script..."

          remote_script=$(cat <<EOF
          #!/usr/bin/env bash

          set -euo pipefail

          export APP_DIR=$(printf '%q' "$APP_DIR")
          export AWS_REGION=$(printf '%q' "$AWS_REGION")
          export ECR_REGISTRY=$(printf '%q' "$ECR_REGISTRY")
          export BACKEND_REPOSITORY=$(printf '%q' "$ECR_BACKEND_REPOSITORY")
          export FRONTEND_REPOSITORY=$(printf '%q' "$ECR_FRONTEND_REPOSITORY")

          stage='entering application directory'

          trap 'status=\$?; echo "ROLLBACK FAILED during: \$stage (exit \$status)" >&2; exit "\$status"' ERR

          echo '=========================================='
          echo 'STARTING ROLLBACK'
          echo '=========================================='

          cd "\$APP_DIR"

          # --------------------------------------------------
          # Check previous digests
          # --------------------------------------------------

          stage='checking previous image digests'
          echo "Stage: \$stage"

          for file in \
            .previous_backend_digest \
            .previous_frontend_digest
          do

            if [ ! -s "\$file" ]; then
              echo "No saved previous image digest at \$file."
              echo "Rollback is unavailable for this deployment."

              exit 1
            fi

          done

          previous_backend=\$(cat .previous_backend_digest)
          previous_frontend=\$(cat .previous_frontend_digest)

          echo "Previous backend image:"
          echo "\$previous_backend"

          echo "Previous frontend image:"
          echo "\$previous_frontend"

          # --------------------------------------------------
          # Login to ECR
          # --------------------------------------------------

          stage='logging in to Amazon ECR'
          echo "Stage: \$stage"

          aws ecr get-login-password \
            --region "\$AWS_REGION" \
            | docker login \
                --username AWS \
                --password-stdin "\$ECR_REGISTRY"

          # --------------------------------------------------
          # Pull previous images
          # --------------------------------------------------

          stage='pulling previous images'
          echo "Stage: \$stage"

          docker pull "\$previous_backend"
          docker pull "\$previous_frontend"

          # --------------------------------------------------
          # Restore tags
          # --------------------------------------------------

          stage='restoring previous image tags'
          echo "Stage: \$stage"

          docker tag \
            "\$previous_backend" \
            "\$ECR_REGISTRY/\$BACKEND_REPOSITORY:latest"

          docker tag \
            "\$previous_frontend" \
            "\$ECR_REGISTRY/\$FRONTEND_REPOSITORY:latest"

          # --------------------------------------------------
          # Restart application
          # --------------------------------------------------

          stage='restarting previous application containers'
          echo "Stage: \$stage"

          docker compose down

          docker compose up -d --no-build

          sleep 15

          # --------------------------------------------------
          # Verify rollback
          # --------------------------------------------------

          stage='checking rolled-back services'
          echo "Stage: \$stage"

          docker compose ps

          docker compose ps \
            --status running \
            --services \
            | grep -qx backend

          docker compose ps \
            --status running \
            --services \
            | grep -qx frontend

          docker compose exec -T backend \
            python -c \
            "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=10)"

          docker compose exec -T frontend \
            wget --spider --quiet \
            http://127.0.0.1/health

          echo '=========================================='
          echo 'ROLLBACK COMPLETED SUCCESSFULLY'
          echo '=========================================='
          EOF
          )

          encoded_script=$(printf '%s' "$remote_script" | base64 -w 0)

          remote_command="echo '$encoded_script' | base64 -d | bash"

          jq -n \
            --arg command "$remote_command" \
            '{commands: [$command]}' \
            > rollback.json

          command_id=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment 'Rollback Meridian deployment' \
            --parameters file://rollback.json \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM rollback command ID: $command_id"

          for attempt in $(seq 1 60); do

            status=$(aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query Status \
              --output text 2>/dev/null || true)

            echo "[$attempt/60] Rollback status: ${status:-Pending}"

            case "$status" in

              Success)

                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$command_id" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query StandardOutputContent \
                  --output text

                exit 0
                ;;

              Failed|Cancelled|TimedOut|Cancelling)

                echo "=========================================="
                echo "ROLLBACK FAILED"
                echo "=========================================="

                aws ssm get-command-invocation \
                  --region "$AWS_REGION" \
                  --command-id "$command_id" \
                  --instance-id "$EC2_INSTANCE_ID" \
                  --query '{
                    Status:Status,
                    StatusDetails:StatusDetails,
                    Output:StandardOutputContent,
                    Error:StandardErrorContent
                  }' \
                  --output json || true

                exit 1
                ;;

              *)
                [ "$attempt" -eq 60 ] || sleep 10
                ;;
            esac

          done

          exit 1
