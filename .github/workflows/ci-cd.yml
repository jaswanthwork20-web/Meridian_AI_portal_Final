name: Meridian CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: meridian-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  ECR_REGISTRY: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION || 'us-east-1' }}.amazonaws.com
  ECR_FRONTEND_REPOSITORY: ${{ vars.ECR_FRONTEND_REPOSITORY || 'github-cicd-demo-frontend' }}
  ECR_BACKEND_REPOSITORY: ${{ vars.ECR_BACKEND_REPOSITORY || 'github-cicd-demo-backend' }}

jobs:
  syntax:
    name: Python syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile backend
        run: python -m compileall -q backend

  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip ruff
      - run: ruff check backend || true

  unused-code:
    name: Unused code scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip vulture || true
      - run: vulture backend --min-confidence 80 || true

  type-check:
    name: MyPy type check
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip mypy || true
      - run: mypy backend --ignore-missing-imports --follow-imports=silent || true

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    env:
      ENVIRONMENT: test
      JWT_SECRET: ci-test-secret-that-is-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip pytest fastapi sqlalchemy python-dotenv bcrypt 'python-jose[cryptography]'
      - run: pytest -q backend/tests/test_auth_security.py

  security:
    name: Bandit security scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip bandit || true
      - run: bandit -r backend -ll -x backend/tests || true

  secrets:
    name: Secret detection
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-scan:
    name: Dependency scan
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip pip-audit || true
      - run: pip-audit -r backend/requirements.txt || true

  build:
    name: Build Docker images
    needs: [syntax, lint, unused-code, type-check, test, security, secrets, dependency-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          tags: meridian/backend:${{ github.sha }}
          outputs: type=docker,dest=/tmp/backend-image.tar
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          tags: meridian/frontend:${{ github.sha }}
          outputs: type=docker,dest=/tmp/frontend-image.tar
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - uses: actions/upload-artifact@v4
        with:
          name: container-images
          path: /tmp/*-image.tar
          retention-days: 1
          if-no-files-found: error

  container-security:
    name: Container vulnerability scan
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: container-images
          path: /tmp/container-images
      - run: |
          docker load -i /tmp/container-images/backend-image.tar
          docker load -i /tmp/container-images/frontend-image.tar
      - name: Scan backend image
        uses: aquasecurity/trivy-action@master #master
        with:
          image-ref: meridian/backend:${{ github.sha }}
          severity: CRITICAL,HIGH
          vuln-type: os,library
          ignore-unfixed: true
          format: json
          output: backend-trivy.json
          exit-code: "0"
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: meridian/frontend:${{ github.sha }}
          severity: CRITICAL,HIGH
          vuln-type: os,library
          ignore-unfixed: true
          format: json
          output: frontend-trivy.json
          exit-code: "0"
      - name: Summarize findings
        if: always()
        shell: bash
        run: |
            python - <<'PY'
            import json
            from pathlib import Path

            for report in ("backend-trivy.json", "frontend-trivy.json"):
              report_path = Path(report)
              print(f"### {report}")
              if not report_path.is_file() or report_path.stat().st_size == 0:
                print("No report generated (scan may have failed before reporting).")
                continue
              with report_path.open(encoding="utf-8") as report_file:
                results = json.load(report_file).get("Results") or []
              findings = [
                vulnerability
                for result in results
                for vulnerability in result.get("Vulnerabilities") or []
              ]
              if not findings:
                print("No vulnerabilities reported.")
              for finding in findings:
                fixed = finding.get("FixedVersion") or "no fix listed"
                print(
                  f"{finding.get('Severity')} {finding.get('VulnerabilityID')} | "
                  f"{finding.get('PkgName')} {finding.get('InstalledVersion')} -> {fixed}"
                )
            PY
      - name: Upload Trivy reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: '*-trivy.json'
          retention-days: 30
          if-no-files-found: warn
          

  sbom:
    name: Generate SBOM
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: container-images
          path: /tmp/container-images
      - run: |
          docker load -i /tmp/container-images/backend-image.tar
          docker load -i /tmp/container-images/frontend-image.tar
      - name: Install Syft
        run: curl -sSfL https://raw.githubusercontent.com/anchore/syft/v1.52.0/install.sh | sh -s -- -b /usr/local/bin v1.52.0
      - name: Generate CycloneDX SBOMs
        run: |
          syft meridian/backend:${GITHUB_SHA} -o cyclonedx-json=backend-sbom.json
          syft meridian/frontend:${GITHUB_SHA} -o cyclonedx-json=frontend-sbom.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: '*-sbom.json'
          retention-days: 90
          if-no-files-found: error

  push-ecr:
    name: Push images to ECR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [container-security, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: container-images
          path: /tmp/container-images
      - run: |
          docker load -i /tmp/container-images/backend-image.tar
          docker load -i /tmp/container-images/frontend-image.tar
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@v2
      - name: Tag and push immutable and latest tags
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker tag "meridian/backend:${IMAGE_TAG}" "${ECR_REGISTRY}/${ECR_BACKEND_REPOSITORY}:${IMAGE_TAG}"
          docker tag "meridian/frontend:${IMAGE_TAG}" "${ECR_REGISTRY}/${ECR_FRONTEND_REPOSITORY}:${IMAGE_TAG}"
          docker tag "meridian/backend:${IMAGE_TAG}" "${ECR_REGISTRY}/${ECR_BACKEND_REPOSITORY}:latest"
          docker tag "meridian/frontend:${IMAGE_TAG}" "${ECR_REGISTRY}/${ECR_FRONTEND_REPOSITORY}:latest"
          docker push "${ECR_REGISTRY}/${ECR_BACKEND_REPOSITORY}:${IMAGE_TAG}"
          docker push "${ECR_REGISTRY}/${ECR_FRONTEND_REPOSITORY}:${IMAGE_TAG}"
          docker push "${ECR_REGISTRY}/${ECR_BACKEND_REPOSITORY}:latest"
          docker push "${ECR_REGISTRY}/${ECR_FRONTEND_REPOSITORY}:latest"

  deploy:
    name: Deploy to EC2 with SSM
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [push-ecr]
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: read
      id-token: write
    env:
      APP_DIR: ${{ vars.EC2_APP_DIR || '/opt/meridian' }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      BACKEND_IMAGE: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION || 'us-east-1' }}.amazonaws.com/${{ vars.ECR_BACKEND_REPOSITORY || 'github-cicd-demo-backend' }}:${{ github.sha }}
      FRONTEND_IMAGE: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.${{ vars.AWS_REGION || 'us-east-1' }}.amazonaws.com/${{ vars.ECR_FRONTEND_REPOSITORY || 'github-cicd-demo-frontend' }}:${{ github.sha }}
      APP_SECRET_NAME: ${{ vars.APP_SECRET_NAME || 'Meridian-Secret-For-EC2' }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy application
        run: bash .github/scripts/ssm-send.sh deploy/deploy.sh 'Deploy Meridian release'

  verify:
    name: Verify deployment
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      APP_DIR: ${{ vars.EC2_APP_DIR || '/opt/meridian' }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Verify deployed services
        run: bash .github/scripts/ssm-send.sh deploy/verify.sh 'Verify Meridian release'

  rollback:
    name: Roll back deployment
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.deploy.result == 'failure' || needs.verify.result == 'failure') }}
    needs: [deploy, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      APP_DIR: ${{ vars.EC2_APP_DIR || '/opt/meridian' }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Restore previous release
        run: bash .github/scripts/ssm-send.sh deploy/rollback.sh 'Rollback Meridian release'
